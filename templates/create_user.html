{% extends "app.html" %}
{% block title %}New User - MyApp Admin{% endblock %}
{% block card_class %}{% endblock %}
{% block content %}
  <h1 class="title">Create User</h1>
  <br>
  <form method="POST" data-validate novalidate>
    {{ csrf_input() }}
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" value="{{ values.name }}" maxlength="100" required>

    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ values.username }}" maxlength="30" required>

    <label for="email">Email</label>
    <input type="text" id="email" name="email" value="{{ values.email }}" maxlength="120" placeholder="user@example.com">

    <label for="password">Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
      <span class="toggle-password" data-target="password">Show</span>
    </div>

    <label for="role">Role</label>
    <select id="role" name="role">
      {% for r in roles %}<option value="{{ r }}" {% if values.role == r %}selected{% endif %}>{{ r|capitalize }}</option>{% endfor %}
    </select>

    <label for="status">Account status</label>
    <select id="status" name="status">
      {% for s in statuses %}<option value="{{ s }}" {% if values.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>

    <div class="field-error"></div>
    <button type="submit" class="btn">Create User</button>
  </form>
  <div class="links"><a href="{{ url_for('admin.users_list') }}">&larr; Back to User Management</a></div>
{% endblock %}
