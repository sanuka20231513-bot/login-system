<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - MyApp</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card">
  <h1 class="title">MyApp</h1>
  <h2 class="subtitle">Set a New Password</h2>
  <p class="note">Account verified: <strong>{{ username }}</strong></p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" data-validate novalidate>
    <label for="new_password">New Password</label>
    <div class="password-wrapper">
      <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
      <span class="toggle-password" data-target="new_password">Show</span>
    </div>

    <label for="confirm_password">Confirm New Password</label>
    <div class="password-wrapper">
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
      <span class="toggle-password" data-target="confirm_password">Show</span>
    </div>

    <div class="field-error"></div>

    <button type="submit" class="btn">Update Password</button>
  </form>

  <div class="links">
    <a href="{{ url_for('login') }}">&larr; Back to Login</a>
  </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
