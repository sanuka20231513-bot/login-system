<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - MyApp</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card">
  <h1 class="title">MyApp</h1>
  <h2 class="subtitle">Create an Account</h2>
  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

    <form method="POST" data-validate novalidate>
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Choose a username" required>

    <label for="password">Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" name="password" placeholder="Choose a password" required>
      <span class="toggle-password" data-target="password">Show</span>
    </div>

    <label for="confirm_password">Confirm Password</label>
    <div class="password-wrapper">
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
      <span class="toggle-password" data-target="confirm_password">Show</span>
    </div>

    <div class="field-error"></div>

    <button type="submit" class="btn">Register</button>
  </form>

  <p class="note">Your account will be <strong>Pending</strong> until an administrator approves it.</p>

  <div class="links">
    <a href="{{ url_for('login') }}">&larr; Back to Login</a>
  </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
