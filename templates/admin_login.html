<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - MyApp</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card">
  <h1 class="title">MyApp Admin</h1>
  <h2 class="subtitle">Administrator Login</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" data-validate novalidate>
    <label for="username">Admin Username</label>
    <input type="text" id="username" name="username" placeholder="Enter admin username" required>

    <label for="password">Admin Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" name="password" placeholder="Enter admin password" required>
      <span class="toggle-password" data-target="password">Show</span>
    </div>

    <div class="field-error"></div>

    <button type="submit" class="btn">Login</button>
  </form>

  <div class="links">
    <a href="{{ url_for('login') }}">&larr; Back to User Login</a>
  </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
