<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - MyApp</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card">
  <h1 class="title">MyApp</h1>
  <h2 class="subtitle">Forgot Password</h2>
  <p class="note">Enter your username and we'll let you set a new password.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

    <form method="POST" data-validate novalidate>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter your username" required>

    <div class="field-error"></div>

    <button type="submit" class="btn">Verify Username</button>
  </form>

  <div class="links">
    <a href="{{ url_for('login') }}">&larr; Back to Login</a>
  </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
