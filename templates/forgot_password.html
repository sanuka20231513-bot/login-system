{% extends "public.html" %}
{% block title %}Forgot Password - MyApp{% endblock %}
{% block content %}
  <h1 class="title">MyApp</h1>
  <h2 class="subtitle">Forgot Password</h2>
  <p class="note">Enter your username and the email address saved on your account.</p>

  {% include "components/flash.html" %}

  <form method="POST" data-validate novalidate>
    {{ csrf_input() }}
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter your username" required>

    <label for="email">Account email</label>
    <input type="text" id="email" name="email" placeholder="Email used on your account" required>

    <div class="field-error"></div>

    <button type="submit" class="btn">Verify Details</button>
  </form>

  <div class="links">
    <a href="{{ url_for('auth.login') }}">&larr; Back to Login</a>
  </div>
{% endblock %}
